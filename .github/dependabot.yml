version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Run a week before consumers on the first Monday of the next month.
    schedule:
      interval: "cron"
      cronjob: "0 9 * * mon#-1"
      timezone: "Europe/Prague"
    groups:
      actions:
        patterns:
          - "*"
