version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Leave time to merge and clear cooldown before consumers run on the 1st.
    schedule:
      interval: "cron"
      cronjob: "0 9 21 * *"
      timezone: "Europe/Prague"
    groups:
      actions:
        patterns:
          - "*"
